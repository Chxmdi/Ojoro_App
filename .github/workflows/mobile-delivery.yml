name: Mobile Delivery

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options: [preview, production]
      platform:
        description: "Target platform"
        required: true
        default: all
        type: choice
        options: [all, ios, android]

permissions:
  contents: read

jobs:
  eas-build:
    if: ${{ vars.MOBILE_DELIVERY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Validate mobile project
        run: pnpm --filter @ojoro/mobile typecheck
      - name: EAS build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm dlx eas-cli build --non-interactive --profile "${{ inputs.profile }}" --platform "${{ inputs.platform }}"
