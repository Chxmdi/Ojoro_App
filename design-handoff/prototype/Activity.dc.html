<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ojoro · Activity</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ojoro/tokens.css">
<link rel="stylesheet" href="ds/ojoro/components/bundle.css">
<script src="ds/ojoro/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
a:hover{color:inherit}
</style>
</helmet>
<div data-theme="calm" style="width: 390px; height: 1310px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font-ui); overflow: hidden;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 0;">
    <a href="GameOn.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;"><x-import component-from-global-scope="Ojoro.Icon" name="back"></x-import></a>
    <span class="oj-overline">ACTIVITY</span>
    <x-import component-from-global-scope="Ojoro.IconButton" icon="chat" label="Activity chat, 3 new" count="{{three}}"></x-import>
  </header>

  <div style="padding: 8px 0 0;">
    <x-import component-from-global-scope="Ojoro.ActivityObject" activity="Pickup football" day="TONIGHT" time="7:30" place="Jeanne-Mance Park" distance="1.2 km" level="Mixed level" count="{{eight}}" capacity="{{eight}}" people="{{people}}" status="confirmed" details="{{no}}"></x-import>
  </div>

  <main style="display: flex; flex-direction: column; gap: 40px; padding: 24px 20px 32px;">
    <section aria-label="Details" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px;"><span class="oj-label oj-muted">TEAMS</span><span class="oj-body-sm">Lights vs Darks. Bring both shirts.</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px;"><span class="oj-label oj-muted">KIT</span><span class="oj-body-sm">Ball and bibs: Ade. Turf boots.</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px;"><span class="oj-label oj-muted">COST</span><span class="oj-body-sm">Free</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px;"><span class="oj-label oj-muted">ATTENDANCE</span><span class="oj-body-sm">Check-in at the pitch. Host confirms.</span></div>
    </section>

    <section aria-label="Who's playing" style="display: flex; flex-direction: column; gap: 8px;">
      <x-import component-from-global-scope="Ojoro.Divider" label="WHO'S PLAYING · 8 OF 8"></x-import>
      <div role="list">
        <x-import component-from-global-scope="Ojoro.ParticipantRow" person="{{ade}}" role="host" meta="Host · Lights"></x-import>
        <x-import component-from-global-scope="Ojoro.ParticipantRow" person="{{chimdi}}" role="in" meta="You · Darks"></x-import>
        <x-import component-from-global-scope="Ojoro.ParticipantRow" person="{{marcus}}" role="in" meta="Lights · running 5 late"></x-import>
        <x-import component-from-global-scope="Ojoro.ParticipantRow" person="{{joel}}" role="in" meta="Darks · joined from your invite"></x-import>
      </div>
      <span class="oj-body-sm oj-muted">+ Lena, Sam, Yara and Tolu · 2 on the waitlist</span>
    </section>

    <section aria-label="Activity chat" style="display: flex; flex-direction: column; gap: 4px;">
      <x-import component-from-global-scope="Ojoro.Divider" label="CHAT"></x-import>
      <x-import component-from-global-scope="Ojoro.Comment" author="Ade B" badge="HOST" time="12m" body="Bibs are in the car. North pitch, by the lights."></x-import>
      <x-import component-from-global-scope="Ojoro.Comment" author="Marcus T" time="4m" body="Running 5 late. Start without me." respect="{{two}}"></x-import>
    </section>

    <section aria-label="Check in" style="display: flex; flex-direction: column; gap: 8px;">
      <a href="CheckIn.dc.html" class="oj-btn oj-btn-commit oj-btn-block" style="text-decoration: none; box-sizing: border-box;">CHECK IN</a>
      <span class="oj-caption oj-muted" style="text-align: center;">Opens at 7:00 when you're within 150 m of the pitch.</span>
      <x-import component-from-global-scope="Ojoro.Button" variant="ghost">I CAN'T MAKE IT ANYMORE</x-import>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1310}}'>
class Component extends DCLogic {
  renderVals() {
    var people = [{ name: 'Ade B' }, { name: 'Chimdi O' }, { name: 'Marcus T' }, { name: 'Joel P' }, { name: 'Lena R' }, { name: 'Sam K' }, { name: 'Yara M' }, { name: 'Tolu D' }];
    return {
      no: false, two: 2, three: 3, eight: 8,
      people: people,
      ade: people[0], chimdi: people[1], marcus: people[2], joel: people[3]
    };
  }
}
</script>
</body>
</html>
