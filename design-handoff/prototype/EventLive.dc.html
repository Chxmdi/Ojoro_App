<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ojoro · Live challenge</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ojoro/tokens.css">
<link rel="stylesheet" href="ds/ojoro/components/bundle.css">
<script src="ds/ojoro/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
a:hover{color:inherit}
</style>
</helmet>
<div data-theme="live" style="width: 390px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font-ui); overflow: hidden;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 0;">
    <a href="EventToday.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;"><x-import component-from-global-scope="Ojoro.Icon" name="back"></x-import></a>
    <span class="oj-overline">CHIMDI VS MARCUS · 5K</span>
    <x-import component-from-global-scope="Ojoro.IconButton" icon="share" label="Share live challenge"></x-import>
  </header>

  <a href="Verifying.dc.html" aria-label="Live: Chimdi 3.4 km, Marcus 3.1 km of 5. Open finish." style="display: block; text-decoration: none;">
    <x-import component-from-global-scope="Ojoro.LiveChallenge" a="{{a}}" b="{{b}}" discipline="5K" unit="KM" target="{{five}}" elapsed="16:42" watching="{{watching}}"></x-import>
  </a>

  <main style="display: flex; flex-direction: column; gap: 32px; padding: 0 20px 32px;">
    <span class="oj-caption oj-muted" style="display: flex; gap: 6px; align-items: center;"><x-import component-from-global-scope="Ojoro.Icon" name="clock" size="{{sixteen}}"></x-import>Updated 8 s ago · GPS watch data, device verified</span>

    <section aria-label="Predictions locked" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface-raised);">
      <span style="display: flex; align-items: center; gap: 8px;"><x-import component-from-global-scope="Ojoro.Badge">LOCKED</x-import><span class="oj-label">PREDICTIONS</span></span>
      <span class="oj-body-sm">The crowd: 46% Chimdi, 54% Marcus. You picked Chimdi.</span>
    </section>

    <section aria-label="Cheer" style="display: flex; flex-direction: column; gap: 12px;">
      <span class="oj-label oj-muted">CHEER THEM ON</span>
      <x-import component-from-global-scope="Ojoro.ReactionBar" reactions="{{reactions}}"></x-import>
    </section>

    <section aria-label="The crowd" style="display: flex; flex-direction: column; gap: 4px;">
      <x-import component-from-global-scope="Ojoro.Divider" label="THE CROWD"></x-import>
      <x-import component-from-global-scope="Ojoro.Comment" author="Ade B" time="now" body="He's pulling away on the climb!" respect="{{nine}}"></x-import>
      <x-import component-from-global-scope="Ojoro.Comment" author="Lena R" time="1m" body="Marcus always finishes fast. Not over yet." respect="{{four}}"></x-import>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      four: 4, five: 5, nine: 9, sixteen: 16, watching: 212,
      a: { name: 'Chimdi', value: 3.4, checkedIn: true },
      b: { name: 'Marcus', value: 3.1, checkedIn: true },
      reactions: [{ label: 'LET’S GO', count: 88, mine: true }, { label: 'RESPECT', count: 41 }, { label: 'HOLD THAT', count: 17 }]
    };
  }
}
</script>
</body>
</html>
