<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ojoro · GAME ON</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ojoro/tokens.css">
<link rel="stylesheet" href="ds/ojoro/components/bundle.css">
<script src="ds/ojoro/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
a:hover{color:inherit}
</style>
</helmet>
<div data-theme="confirmed" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font-ui); overflow: hidden;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 0 20px;">
    <span class="oj-overline">JUST NOW · JOEL MADE IT 8</span>
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;"><x-import component-from-global-scope="Ojoro.Icon" name="close"></x-import></a>
  </header>

  <x-import component-from-global-scope="Ojoro.GameOnPoster" activity="Football" time="Tonight 7:30" place="Jeanne-Mance Park" count="{{eight}}" people="{{people}}"></x-import>

  <section aria-label="Next steps" style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 20px 32px;">
    <p class="oj-body-sm oj-muted" style="margin: 0 0 8px;">All 8 got this at the same moment. Check-in opens at 7:00.</p>
    <a href="Activity.dc.html" class="oj-btn oj-btn-primary oj-btn-block" style="text-decoration: none; box-sizing: border-box;">OPEN THE GAME</a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <x-import component-from-global-scope="Ojoro.Button" variant="secondary" block="{{yes}}">ADD TO CALENDAR</x-import>
      <x-import component-from-global-scope="Ojoro.Button" variant="secondary" block="{{yes}}">DIRECTIONS</x-import>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, eight: 8,
      people: [{ name: 'Ade B' }, { name: 'Chimdi O' }, { name: 'Marcus T' }, { name: 'Lena R' }, { name: 'Sam K' }, { name: 'Yara M' }, { name: 'Tolu D' }, { name: 'Joel P', isNew: true }]
    };
  }
}
</script>
</body>
</html>
