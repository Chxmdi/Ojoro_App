<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ojoro · Live game</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ojoro/tokens.css">
<link rel="stylesheet" href="ds/ojoro/components/bundle.css">
<script src="ds/ojoro/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
a:hover{color:inherit}
</style>
</helmet>
<div data-theme="live" style="width: 390px; height: 920px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font-ui); overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 0;">
    <a href="CheckIn.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;"><x-import component-from-global-scope="Ojoro.Icon" name="back"></x-import></a>
    <x-import component-from-global-scope="Ojoro.LiveIndicator"></x-import>
    <span class="oj-numeric oj-muted">34:12</span>
    <span style="margin-left: auto;"><x-import component-from-global-scope="Ojoro.IconButton" icon="share" label="Share live game"></x-import></span>
  </header>

  <main style="display: flex; flex-direction: column; gap: 32px; padding: 24px 20px 32px;">
    <section aria-label="Score: Lights 3, Darks 2" style="display: flex; flex-direction: column; gap: 16px;">
      <span class="oj-overline">FOOTBALL · JEANNE-MANCE · 8 PLAYING</span>
      <div style="display: flex; align-items: flex-end; justify-content: space-between;">
        <div><div class="oj-display oj-display-sm">LIGHTS</div><div class="oj-display oj-display-hero">3</div></div>
        <span aria-hidden="true" style="width: 6px; height: 112px; background: var(--text); transform: skewX(-24deg); align-self: center;"></span>
        <div style="text-align: right;"><div class="oj-display oj-display-sm">DARKS</div><div class="oj-display oj-display-hero">2</div></div>
      </div>
      <span class="oj-caption oj-muted" style="display: flex; gap: 6px; align-items: center;"><x-import component-from-global-scope="Ojoro.Icon" name="clock" size="{{sixteen}}"></x-import>Updated 20 s ago · logged by Ade (host)</span>
    </section>

    <section aria-label="Updates" style="display: flex; flex-direction: column; gap: 8px;">
      <x-import component-from-global-scope="Ojoro.Divider" label="UPDATES"></x-import>
      <x-import component-from-global-scope="Ojoro.HypePost" kind="system" time="8:01" body="GOAL · MARCUS. LIGHTS LEAD 3–2."></x-import>
      <x-import component-from-global-scope="Ojoro.HypePost" kind="system" time="7:52" body="HALF TIME. 2–2."></x-import>
      <x-import component-from-global-scope="Ojoro.Comment" author="Yara M" time="1m" body="Darks need one more. Joel is everywhere."></x-import>
    </section>

    <section aria-label="Cheer" style="display: flex; flex-direction: column; gap: 12px;">
      <span class="oj-label oj-muted">THURSDAY FC IS FOLLOWING</span>
      <x-import component-from-global-scope="Ojoro.ReactionBar" reactions="{{reactions}}"></x-import>
    </section>

    <section aria-label="Full time" style="display: flex; flex-direction: column; gap: 8px;">
      <span class="oj-body-sm oj-muted">Ade calls full time. Then the After window opens for 24 hours.</span>
      <a href="After.dc.html" class="oj-btn oj-btn-secondary oj-btn-block" style="text-decoration: none; box-sizing: border-box;">FULL TIME</a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sixteen: 16,
      reactions: [{ label: 'LET’S GO', count: 9, mine: true }, { label: 'RESPECT', count: 4 }, { label: 'HOLD THAT', count: 2 }]
    };
  }
}
</script>
</body>
</html>
