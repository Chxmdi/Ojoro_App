<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ojoro · Share poster</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ojoro/tokens.css">
<link rel="stylesheet" href="ds/ojoro/components/bundle.css">
<script src="ds/ojoro/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="live" style="width: 540px; height: 675px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 36px; background: var(--surface); color: var(--text); font-family: var(--font-ui); overflow: hidden;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <span class="oj-display oj-display-xs" style="letter-spacing: 0.06em;">OJORO</span>
    <span class="oj-label oj-muted">CALL-OUT ACCEPTED</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span class="oj-display oj-display-hero" style="font-size: 132px;">CHIMDI</span>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span aria-hidden="true" style="flex: 1; height: 6px; background: var(--text); transform: skewX(-24deg);"></span>
      <span class="oj-display oj-display-md">VS</span>
      <span aria-hidden="true" style="flex: 1; height: 6px; background: var(--text); transform: skewX(-24deg);"></span>
    </div>
    <span class="oj-display oj-display-hero" style="font-size: 132px; text-align: right;">MARCUS</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 16px;">
      <span class="oj-display oj-display-lg">5K</span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
        <span class="oj-title">Sat 12 Oct · 9:00</span>
        <span class="oj-body-sm oj-muted">Mount Royal loop, Montréal</span>
      </span>
    </div>
    <span class="oj-label">WHO TAKES IT? FOLLOW, PREDICT AND BACK ON OJORO</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":675}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
